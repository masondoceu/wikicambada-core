name = "heartbeat-wiki"
compatibility_date = "2026-06-22"
pages_build_output_dir = ".wikicambada/public"

[vars]
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
ACCESS_STRICT = "true"
WIKI_ACCESS_MODE = "public"
PUBLIC_BASE_URL = "https://aboutheartbeat.pages.dev"
WIKI_SITE_NAME = "Heartbeat Wiki"
WIKI_SUPER_ADMIN_EMAIL = "mason@national.shitposting.agency"
WIKI_CORE_VERSION = "v1.1.0-r2"
WIKI_FEATURES_JSON = "{\"search\":true,\"talkPages\":false,\"userPages\":false,\"publicSuggestions\":false,\"pageHistory\":true,\"mediaUploads\":true,\"templates\":true,\"categories\":true,\"randomPage\":false,\"coreBadge\":true,\"activityLogging\":true,\"specialPages\":{\"index\":true,\"version\":true,\"recentPages\":true,\"allPages\":true,\"categories\":true,\"randomPage\":false}}"

[[d1_databases]]
binding = "DB"
database_name = "heartbeat-wiki-d1"
database_id = ""
preview_database_id = ""
migrations_dir = "src/data/migrations"
migrations_table = "d1_migrations"

[[r2_buckets]]
binding = "WIKI_BUCKET"
bucket_name = "heartbeat-wiki-r2"
