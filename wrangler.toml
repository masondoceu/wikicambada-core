name = "my-wiki"
compatibility_date = "2026-06-22"
pages_build_output_dir = ".wikicambada/public"

[vars]
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
ACCESS_STRICT = "true"
WIKI_ACCESS_MODE = "cloudflare-access"
PUBLIC_BASE_URL = ""
WIKI_SITE_NAME = "Minha Wiki"
WIKI_INTERFACE_LANGUAGE = "pt-BR"
WIKI_SUPER_ADMIN_EMAIL = ""
WIKI_CORE_VERSION = "v1.1.1-indev.2"
WIKI_FEATURES_JSON = "{\"cloudflareBadge\":true,\"builtWithCloudflareBadge\":false}"

[[d1_databases]]
binding = "DB"
database_name = "my-wiki-db"
database_id = ""
preview_database_id = ""
migrations_dir = "src/data/migrations"
migrations_table = "d1_migrations"

[[r2_buckets]]
binding = "WIKI_BUCKET"
bucket_name = "my-wiki-uploads"
